[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-comment-agent"
version = "0.1.0"
description = "Automated social comment insight pipeline for PM/developer/test/acceptance agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
social-comment-agent = "social_comment_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
social_comment_agent = ["templates/platforms/*.json"]
